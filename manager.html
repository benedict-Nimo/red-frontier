<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}[hidden]{display:none!important}</style></head><body><title>Outpost Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D Mars scene; mission-control panels dock left/right on desktop,
   collapse to a tabbed bottom sheet on phones. Single committed dark look (night-shift mission control). */
:root{
  --ground:#140d0b;
  --panel:rgba(31,21,18,.90);
  --panel2:#2a1c17;
  --line:#4b342b;
  --fg:#f5e9df;
  --muted:#bda594;
  --rust:#ff7d45;
  --sky:#e9b680;
  --ice:#8fd8f2;
  --good:#80d897;
  --warn:#f5c24f;
  --bad:#ff6253;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);font-weight:600}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:grid;
  grid-template-columns:300px 1fr 340px;grid-template-rows:auto 1fr auto;gap:12px;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud[hidden]{display:none!important}
#hud>*{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#topbar{grid-column:1/4;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 12px}
#topbar .brand{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--rust)}
#solbox{display:flex;align-items:baseline;gap:6px}
#solbox .big{font-family:var(--f-display);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12px;white-space:nowrap}
.chip.good{border-color:color-mix(in srgb,var(--good) 50%,transparent);color:var(--good)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn)}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
#season{display:flex;align-items:center;gap:8px;min-width:150px;flex:1}
#season .track{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,#e9b680,#c98a5a 55%,#cfe4ee);position:relative;max-width:220px}
#season .pin{position:absolute;top:-4px;width:3px;height:14px;background:var(--fg);border-radius:2px}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-size:12px}
.tbtn[aria-pressed="true"]{border-color:var(--sky);color:var(--sky)}
#leftp,#rightp{overflow:auto;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px}
#leftp{grid-column:1;grid-row:2}
#rightp{grid-column:3;grid-row:2}
#bottom{grid-column:1/4;grid-row:3;display:flex;gap:12px;align-items:stretch}
#logbox{flex:1;min-width:0;padding:8px 12px;display:flex;flex-direction:column;gap:2px;max-height:92px;overflow:hidden;cursor:pointer}
#logbox .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted)}
#logbox .row:first-child{color:var(--fg)}
#logbox .sol{font-family:var(--f-mono);color:var(--rust);margin-right:6px;font-size:11px}
#endbtn{min-width:200px;border:none;border-radius:6px;background:var(--rust);color:#1a0d07;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;padding:10px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 24px rgba(255,125,69,.25)}
#endbtn small{font-family:var(--f-body);font-weight:400;font-size:11px;letter-spacing:0;opacity:.8}
#endbtn:disabled{background:#5a4038;color:#bda594;box-shadow:none;cursor:not-allowed}
#tabs{display:none}

/* vitals */
.vital{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
.vital .name{font-weight:700;font-size:13px}
.vital .val{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.vital .bar{grid-column:1/3;height:7px;border-radius:4px;background:#3a2822;overflow:hidden}
.vital .bar i{display:block;height:100%;border-radius:4px;transition:width .6s ease}
.vital .sub{grid-column:1/3;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:9px}
.sec+.sec{border-top:1px solid var(--line);padding-top:12px}
.obj{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.obj .box{flex:none;width:16px;height:16px;border-radius:3px;border:1.5px solid var(--muted);margin-top:2px;display:grid;place-items:center;font-size:11px}
.obj.done .box{background:var(--good);border-color:var(--good);color:#10240f}
.obj.fail .box{background:var(--bad);border-color:var(--bad);color:#2a0b07}
.math{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;background:#1b1210;border:1px dashed var(--line);border-radius:5px;padding:8px}
.math b{color:var(--fg);font-weight:600}
.forecast{font-size:13px;padding:8px 10px;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}

/* right panel */
.rtabs{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:6px;border:1px solid var(--line)}
.rtabs button{flex:1;border:none;background:none;padding:6px 4px;border-radius:4px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted)}
.rtabs button[aria-selected="true"]{background:var(--rust);color:#1a0d07}
.crew{border:1px solid var(--line);border-radius:6px;padding:9px;display:flex;flex-direction:column;gap:7px;background:#22171480}
.crew .hd{display:flex;align-items:center;gap:8px}
.crew .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12px;color:#160c08;flex:none}
.crew .nm{font-weight:700;font-size:13.5px;line-height:1.1}
.crew .rl{font-size:11.5px;color:var(--muted)}
.crew .dose{margin-left:auto;text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tasks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tasks button{border:1px solid var(--line);background:var(--panel2);border-radius:4px;font-size:11.5px;padding:5px 2px;line-height:1.1}
.tasks button.out{border-style:dashed}
.tasks button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#1a0d07;font-weight:700}
.note{font-size:12px;color:var(--muted)}
.warnline{font-size:12.5px;color:var(--warn)}
.sys{display:grid;grid-template-columns:1fr auto;gap:2px 8px;border:1px solid var(--line);border-radius:6px;padding:8px 9px;align-items:center}
.sys.sel{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky)}
.sys .t{font-weight:700;font-size:13px}
.sys .s{font-size:11.5px;color:var(--muted);grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sbtn{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:4px 9px;font-size:12px}
.sbtn.on{border-color:var(--good);color:var(--good)}
.sbtn.primary{background:var(--sky);border-color:var(--sky);color:#1a0d07;font-weight:700}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.prog{height:6px;background:#3a2822;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ice)}
.bcard{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:9px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bcard[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky)}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(12,7,6,.62);
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
#modal[hidden],#placehint[hidden]{display:none!important}
#modal.clear{background:linear-gradient(180deg,rgba(12,7,6,.15),rgba(12,7,6,.7))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:100%;max-width:880px;padding:24px;display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.narrow{max-width:560px}
.card p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--f-display);color:var(--rust);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:600}
.cta{border:none;border-radius:6px;background:var(--rust);color:#1a0d07;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;padding:11px 22px}
.cta:disabled{background:#5a4038;color:#bda594;cursor:not-allowed}
.ghost{border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:10px 16px;font-family:var(--f-display);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.title-hero{max-width:980px;background:none;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;gap:22px}
.title-hero h1{font-size:clamp(44px,9vw,96px);line-height:.9;font-weight:700;letter-spacing:.02em;color:var(--fg);text-shadow:0 4px 30px rgba(0,0,0,.5)}
.title-hero h1 span{color:var(--rust)}
.title-hero .tag{font-size:clamp(15px,2.2vw,19px);max-width:52ch;color:var(--fg);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.rank{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rank:hover{border-color:var(--rust)}
.rank h3{font-size:22px}
.rank .meta{font-family:var(--f-mono);font-size:12px;color:var(--sky)}
.steps{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--fg)}
.steps b{font-family:var(--f-mono);color:var(--rust);margin-right:4px}

.fact{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:4px}
.fact .n{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--sky);line-height:1.1}
.fact .d{font-size:13px;color:var(--muted)}

/* manifest */
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .bar{height:10px;background:#3a2822;border-radius:5px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--sky);transition:width .25s}
.meter.over .bar i{background:var(--bad)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.item .nm{font-weight:700}
.item .mc{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.item .st{font-size:12.5px;color:var(--sky)}
.item .tr{font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px;margin-top:auto}
.step button{width:30px;height:28px;border-radius:4px;border:1px solid var(--line);background:#1c1311;font-weight:700}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step .c{font-family:var(--f-mono);min-width:22px;text-align:center;font-size:15px}
.item.has{border-color:color-mix(in srgb,var(--sky) 55%,var(--line))}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.check .ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#160c08;margin-top:1px}
.ic.good{background:var(--good)}.ic.warn{background:var(--warn)}.ic.bad{background:var(--bad)}
.prio{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.prio input{width:100%;accent-color:var(--rust)}

/* events */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:4px}
.opt:hover:not(:disabled){border-color:var(--rust)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .l{font-family:var(--f-display);font-weight:700;font-size:16px}
.opt .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.tag.p{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.tag.m{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.didyou{border-left:3px solid var(--ice);padding:6px 10px;background:#18202414;font-size:13px;color:var(--fg)}
.didyou b{color:var(--ice)}

/* expedition */
#xwrap{position:relative;width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
#xcv{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:320/170;max-width:100%}
.xhud{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;align-items:center}
.xhud .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-family:var(--f-display)}
.xbar{width:110px;height:8px;background:#3a2822;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.xbar i{display:block;height:100%;background:var(--good)}
.pad-btns{display:flex;gap:8px}
.pad-btns button{flex:1;min-height:48px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-family:var(--f-display);font-weight:700;font-size:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad-btns button.active{background:var(--sky);color:#1a0d07}
#xtoast{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(20,13,11,.9);border:1px solid var(--ice);border-radius:5px;padding:6px 10px;font-size:12.5px;opacity:0;transition:opacity .3s;pointer-events:none}
#xtoast.show{opacity:1}

/* debrief */
.grade{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1;color:var(--rust)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.score{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel2)}
.score .v{font-family:var(--f-mono);font-size:22px}
.score .w{font-size:11.5px;color:var(--muted)}
.sparks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.spark{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel2)}
.spark canvas{width:100%;height:60px;display:block}
.lessons{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:13px;max-width:min(560px,calc(100vw - 32px));opacity:0;transition:opacity .35s;pointer-events:none}
#toast.show{opacity:1}
#placehint{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:12;background:var(--sky);color:#1a0d07;font-weight:700;border-radius:999px;padding:7px 16px;font-size:13px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* ---------- Phone ---------- */
@media (max-width:860px){
  #hud{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;gap:8px}
  #topbar{grid-column:1;padding:6px 10px;gap:8px}
  #topbar .brand,#season{display:none}
  #leftp,#rightp{grid-column:1;grid-row:3;max-height:44vh;display:none}
  #leftp.active,#rightp.active{display:flex}
  #bottom{grid-column:1;grid-row:4;gap:8px}
  #bottom{flex-wrap:wrap}
  #logbox{display:none}
  #logbox.active{display:flex;order:-1;flex-basis:100%;max-height:30vh;overflow:auto}
  #tabs{display:flex;flex:1;gap:4px}
  #tabs button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:13px;padding:6px 2px}
  #tabs button[aria-selected="true"]{border-color:var(--rust);color:var(--rust)}
  #endbtn{min-width:120px;font-size:15px;padding:8px 10px}
  .meters{grid-template-columns:1fr}
  .card{padding:16px}
}
/* NASA + juice */
.nphoto{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column}
.nphoto img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#2a1c17}
.nphoto figcaption{padding:8px 10px;font-size:12px;color:var(--muted);line-height:1.4}
.nphoto figcaption b{color:var(--fg);display:block;font-size:13px}
.nphoto figcaption a{color:var(--sky)}
.nphoto.noimg img{display:none}
.nphoto.wide{flex-direction:row}.nphoto.wide img{width:38%;aspect-ratio:auto;min-height:120px;flex:none}
@media (max-width:620px){.nphoto.wide{flex-direction:column}.nphoto.wide img{width:100%;aspect-ratio:16/9}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tl{position:relative;height:64px;border-bottom:2px solid var(--line);margin:8px 14px 22px}
.tlm{position:absolute;bottom:-20px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tld{position:absolute;bottom:10px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:2px solid var(--sky);background:color-mix(in srgb,var(--sky) 40%,transparent);padding:0;transition:transform .15s}
.tld.hot{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 45%,transparent);width:26px;height:26px}
.tld:hover,.tld.on{transform:translateX(-50%) scale(1.3)}
.tld.on{box-shadow:0 0 0 3px var(--fg)}
.thumb{width:100%;height:84px;object-fit:cover;border-radius:4px;display:block}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.bdg{font-size:11px;padding:2px 8px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.bdg.on{border-style:solid;border-color:var(--rust);color:var(--rust);background:color-mix(in srgb,var(--rust) 12%,transparent)}
.tradechip{display:inline-block;font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);border:1px solid color-mix(in srgb,var(--rust) 50%,transparent);border-radius:999px;padding:2px 9px}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
body.shake #hud,body.shake #world{animation:shake .5s}

.title-actions{display:flex;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   RED FRONTIER — Junior Astronaut Mission Trainer
   Turn-based Mars outpost sim (3D, three.js) + 2D pixel rover expedition.
   ===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const fmt=(v,d=0)=>(Math.round(v*10**d)/10**d).toFixed(d);
const sgn=(v,d=0)=>(v>=0?'+':'−')+fmt(Math.abs(v),d);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- Game data ---------------- */
const CREW_PER_SOL={o2:0.84,water:2.5,food:1};   // per astronaut per sol (water = net loss after ~90% recycling)
const CREW0=[
  {name:'Amara Osei',role:'Engineer',color:'#f0a94a',perk:'Cleans and repairs 50% faster'},
  {name:'Lin Wei',role:'Botanist',color:'#8ed38c',perk:'Farms 50% better'},
  {name:'Diego Ramos',role:'Geologist',color:'#ff8a5c',perk:'Finds 50% more science'},
  {name:'Nadia Haddad',role:'Medic',color:'#93cdee',perk:'Resting heals the whole crew'},
];
const TASKS={
  hab:{label:'Hab ops',out:false,desc:'Run life support and cook. Small morale boost. Stays inside.'},
  rest:{label:'Rest',out:false,desc:'Recover health and morale. Stays inside.'},
  farm:{label:'Farm',out:false,desc:'Wash perchlorate out of greenhouse soil, then tend crops for bigger harvests.'},
  maint:{label:'Maintain',out:true,desc:'Clean dust off solar panels and fix broken gear. Half a sol outside.'},
  berm:{label:'Build berm',out:true,desc:'Pile regolith over the habitat for free radiation shielding. 8 crew-sols to finish. Outside.'},
  eva:{label:'Science EVA',out:true,desc:'Explore and collect samples for science. Outside all sol: highest radiation dose.'},
};
const DEF={
  solar:{name:'Solar Array',mass:1.2,cost:3,max:6,pad:true,use:0,stat:'+45 kWh per sol in full sun',
    trade:'Light and cheap. Makes nothing at night, collects dust, and dust storms cut it by 75%.'},
  reactor:{name:'Fission Reactor',mass:4,cost:18,max:1,pad:true,outer:true,use:0,stat:'+240 kWh per sol, day and night',
    trade:'Heavy and expensive, but storms and darkness do not affect it. Must sit on the outer ring, far from the crew.'},
  battery:{name:'Battery Bank',mass:0.8,cost:3,max:3,pad:true,use:0,stat:'Stores 150 kWh',
    trade:'Makes no energy. Without enough storage, daytime solar power is wasted and the nights go cold.'},
  drill:{name:'Ice Drill',mass:1.5,cost:6,max:2,pad:true,use:35,stat:'+45 L water per sol · uses 35 kWh',
    trade:'Bores about 10 m down to buried ice. It turns power into water, so it needs a strong grid.'},
  moxie:{name:'CO₂ Oxygen Maker',mass:1,cost:7,max:2,pad:true,use:40,stat:'+2.4 kg O₂ per sol · uses 40 kWh',
    trade:'Splits oxygen out of the carbon dioxide air. Needs no water, but it is power hungry.'},
  electro:{name:'Water Splitter',mass:0.8,cost:4,max:2,pad:true,use:30,stat:'5 L water → 4.4 kg O₂ per sol · 30 kWh',
    trade:'Makes lots of oxygen, but every litre it splits is a litre nobody can drink.'},
  greenhouse:{name:'Greenhouse',mass:2,cost:8,max:1,pad:true,use:50,stat:'+3 meals per sol once crops grow (8 sols)',
    trade:'Fresh food and better morale. Uses 50 kWh and 12 L water per sol, and the soil must first be washed of toxic perchlorate.'},
  rover:{name:'Science Rover',mass:2.5,cost:10,max:1,pad:true,use:0,stat:'Unlocks expeditions · +40% EVA science',
    trade:'Heavy, and it makes no air, food or water. It is the reason the mission exists.'},
  poly:{name:'Polyethylene Shield',mass:1,cost:9,max:1,pad:false,stat:'−30% radiation inside the habitat',
    trade:'Light and ready on landing, but expensive. A regolith berm is free, but costs crew time outside.'},
  spares:{name:'Spare Parts Kit',mass:0.3,cost:2,max:5,pad:false,stat:'Instantly repairs one breakdown',
    trade:'Dead weight until something breaks. Then it is priceless.'},
  o2tank:{name:'Oxygen Tanks',mass:1,cost:2,max:6,pad:false,stat:'+60 kg O₂ ≈ 18 sols for 4 crew',
    trade:'Simple and reliable, but heavy. Pressure tanks weigh far more than the gas inside.'},
  watertank:{name:'Water Tanks',mass:1,cost:1,max:3,pad:false,stat:'+800 L water',
    trade:'Cheap. Spare water can also be pumped into the habitat walls as radiation shielding.'},
  food:{name:'Food Crates',mass:1,cost:1,max:6,pad:false,stat:'+110 meals ≈ 27 sols for 4 crew',
    trade:'Cheap and safe, but packaged food gets dull. Morale slowly drops without fresh crops.'},
};
const ORDER=['solar','reactor','battery','drill','moxie','electro','greenhouse','rover','poly','spares','o2tank','watertank','food'];
const RANKS={
  cadet:{label:'Cadet',N:30,mass:15,budget:50,dose:55,sci:80,spe:20,math:false,
    blurb:'30 sols. Bigger budget, hints on, and a starter cargo plan if you want it.'},
  commander:{label:'Commander',N:45,mass:15,budget:45,dose:60,sci:150,spe:25,math:true,
    blurb:'45 sols into the polar winter. Tighter budget, more breakdowns, the math on screen.'},
};
const PRIOS=[['safety','Crew safety'],['science','Science'],['selfsuff','Living off Mars'],['budget','Saving money']];

/* ---------------- State ---------------- */
let S=null;
function newState(rank){
  const R=RANKS[rank];
  return {rank,N:R.N,massCap:R.mass,budget:R.budget,doseLimit:R.dose,sciGoal:R.sci,speDose:R.spe,
    phase:'title',math:R.math,weights:{safety:4,science:3,selfsuff:2,budget:1},
    manifest:{},spent:0,massUsed:0,
    sol:1,o2:10,water:40,food:12,battery:60,batCap:60,health:100,morale:80,science:0,
    dust:1,storm:0,speToday:false,shelter:false,winter:false,winterMode:null,frost:0,
    berm:0,waterWall:false,poly:false,spares:0,oven:false,drillSlow:0,roverCool:0,
    gh:{soil:0,growth:0},modules:[],pending:[],nextId:1,
    crew:CREW0.map(c=>({...c,task:'hab',dose:0})),
    made:{o2:0,water:0,food:0},used:{o2:0,water:0,food:0},
    hist:[],log:[],choices:[],seen:{},lastEvent:0,minBattery:999,blackouts:[],stormSolarMin:null,
    script:{[Math.round(R.N*.27)]:'spe',[Math.round(R.N*.45)]:'storm',[Math.round(R.N*.62)]:'winter',[Math.round(R.N*.82)]:'spe2',[Math.round(R.N*.18)]:'downlink',[Math.round(R.N*.55)]:'sensors'},
    last:null,failed:null,ended:false,sel:null,badges:[],quiz:{asked:[],right:0,total:0,streak:0},labDone:false,savedTasks:null};
}

/* ---------------- Physics of the outpost ---------------- */
function sunFactor(sol=S.sol){return (1-0.45*(sol-1)/S.N)*(S.storm>0?0.25:1)}
function coldFactor(sol=S.sol){return (sol-1)/S.N+(S.winter?0.2:0)}
function active(m){return m.on&&!m.broken}
function moduleUse(m){
  if(!active(m))return 0;
  if(m.type==='greenhouse')return S.gh.soil<2?10:50;
  if(m.type==='electro'&&S.water<5)return 0;
  return DEF[m.type].use||0;
}
function powerPlan(){
  let sN=0,rN=0;
  for(const m of S.modules){if(!active(m))continue;if(m.type==='solar')sN++;if(m.type==='reactor')rN++}
  const sun=sunFactor();
  const solar=sN*45*sun*S.dust, reactor=rN*240;
  const cold=coldFactor();
  const heat=40*cold+(S.winterMode==='heat'?20:0);
  const hab=40+heat;
  let mods=0;const modLines=[];
  for(const m of S.modules){const u=moduleUse(m);if(u){mods+=u;modLines.push([DEF[m.type].name,u])}}
  if(S.oven){mods+=25;modLines.push(['Sulfate oven',25])}
  const load=hab+mods;
  // night check: what the battery must cover after sunset
  const nightNeed=Math.max(0,load/2-reactor/2);
  return {sN,rN,sun,solar,reactor,cold,heat,hab,mods,modLines,load,net:solar+reactor-load,nightNeed};
}
function shieldMult(){return (1-0.45*S.berm/8)*(S.waterWall?0.65:1)*(S.poly?0.7:1)}
function batCap(){return 60+150*S.modules.filter(m=>m.type==='battery'&&!m.broken).length}

function simulateSol(){
  const r={lines:[],o2:0,water:0,food:0,power:0,sci:0,dose:[0,0,0,0],notes:[]};
  const before={o2:S.o2,water:S.water,food:S.food,battery:S.battery,health:S.health,morale:S.morale,science:S.science};
  const C=S.crew;
  const by=t=>C.filter(c=>c.task===t);
  // ---- crew work
  const mt=by('maint');
  let repairs=0;
  for(const c of mt){
    const k=c.role==='Engineer'?1.5:1;
    S.dust=Math.min(1,S.dust+0.25*k);
    const br=S.modules.find(m=>m.broken);
    if(br&&repairs<1+(c.role==='Engineer'?1:0)){br.broken=false;repairs++;r.notes.push(`${c.name.split(' ')[0]} repaired the ${DEF[br.type].name}.`)}
  }
  const gh=S.modules.find(m=>m.type==='greenhouse');
  let farmBonus=0;
  for(const c of by('farm')){
    const k=c.role==='Botanist'?1.5:1;
    if(!gh){r.notes.push(`${c.name.split(' ')[0]} had no greenhouse to farm.`);continue}
    if(S.gh.soil<2){S.gh.soil=Math.min(2,S.gh.soil+k);S.water-=20;r.water-=20;
      if(S.gh.soil>=2)r.notes.push('Greenhouse soil is clean of perchlorate. Seeds planted!');}
    else farmBonus+=0.5*k;
  }
  const bermers=by('berm');
  if(bermers.length&&S.berm<8){S.berm=Math.min(8,S.berm+bermers.length);if(S.berm>=8){r.notes.push('Regolith berm complete: radiation inside the hab cut by 45%.');setTimeout(()=>award('speed'),3400)}}
  // ---- power
  const P=powerPlan();
  S.batCap=batCap();
  let bat=Math.min(S.battery,S.batCap),deficit=0,wasted=0;
  bat+=P.solar+P.reactor/2-P.load/2;
  if(bat>S.batCap){wasted=bat-S.batCap;bat=S.batCap}
  if(bat<0){deficit+=-bat;bat=0}
  bat+=P.reactor/2-P.load/2;
  if(bat<0){deficit+=-bat;bat=0}
  S.battery=bat;S.minBattery=Math.min(S.minBattery,bat);
  let f=1,habShort=0;
  if(deficit>0){f=P.mods>0?Math.max(0,1-deficit/P.mods):0;habShort=Math.max(0,deficit-P.mods)}
  if(S.storm>0&&P.sN){const pct=Math.round(P.sun*S.dust*100);S.stormSolarMin=S.stormSolarMin==null?pct:Math.min(S.stormSolarMin,pct)}
  r.P=P;r.deficit=deficit;r.wasted=wasted;r.f=f;
  r.lines.push(`<b>Power</b> solar ${fmt(P.solar)} (${P.sN}×45×${fmt(P.sun*100)}% sun×${fmt(S.dust*100)}% clean) + reactor ${fmt(P.reactor)} − load ${fmt(P.load)} kWh`);
  r.lines.push(`  load = hab 40 + heating ${fmt(P.heat)} + machines ${fmt(P.mods)}`);
  if(deficit>0)r.lines.push(`  shortfall ${fmt(deficit)} kWh → machines ran at ${fmt(f*100)}%`);
  if(wasted>0)r.lines.push(`  ${fmt(wasted)} kWh wasted: batteries full`);
  // ---- production
  let o2p=0,wp=0,fp=0,wm=0;
  for(const m of S.modules){
    if(!active(m))continue;
    if(m.type==='drill')wp+=45*f*(S.drillSlow>0?0.5:1);
    if(m.type==='moxie')o2p+=2.4*f;
    if(m.type==='electro'&&S.water>=5){wm+=5*f;o2p+=4.4*f}
    if(m.type==='greenhouse'&&S.gh.soil>=2){wm+=12*f;S.gh.growth+=f;if(S.gh.growth>=8){fp+=(3+farmBonus)*f;o2p+=0.8*f}}
  }
  if(S.oven)wp+=15*f;
  const n=C.length;
  const o2use=CREW_PER_SOL.o2*n,wuse=CREW_PER_SOL.water*n,fuse=CREW_PER_SOL.food*n;
  S.o2+=o2p-o2use;S.water+=wp-wm-wuse;S.food+=fp-fuse;
  S.made.o2+=o2p;S.made.water+=wp;S.made.food+=fp;
  S.used.o2+=o2use;S.used.water+=wuse;S.used.food+=fuse;
  r.lines.push(`<b>Oxygen</b> made ${fmt(o2p,1)} − crew ${fmt(o2use,2)} (4×0.84 kg) = ${sgn(o2p-o2use,1)} kg`);
  r.lines.push(`<b>Water</b> drilled ${fmt(wp)} − machines ${fmt(wm)} − crew ${fmt(wuse)} (4×2.5 L after recycling) = ${sgn(wp-wm-wuse)} L`);
  r.lines.push(`<b>Food</b> grown ${fmt(fp,1)} − eaten ${fuse} meals = ${sgn(fp-fuse,1)}`);
  // ---- health and shortages
  let dh=0,dm=-1.5;
  if(habShort>0){dh-=5+habShort/10;dm-=8;r.notes.push(`Blackout! Heaters failed for part of the night (${fmt(habShort)} kWh short).`);S.blackouts.push(S.sol)}
  if(S.water<0){S.water=0;dh-=15;dm-=6;r.notes.push('The water ran out. The crew is dehydrated.')}
  if(S.food<0){S.food=0;dh-=10;dm-=6;r.notes.push('The food ran out. The crew is going hungry.')}
  if(S.winterMode==='bundle')dm-=1.5;
  if(gh&&S.gh.growth>=8)dm+=1;
  // ---- radiation
  const sm=shieldMult();
  C.forEach((c,i)=>{
    const t=TASKS[c.task];
    let d=c.task==='eva'?0.7:c.task==='berm'?0.62:c.task==='maint'?0.45+0.22*sm:0.45*sm;
    if(S.speToday){
      if(t.out)d+=c.task==='maint'?S.speDose*1.2:S.speDose*2;
      else d+=S.speDose*sm*(S.shelter?0.5:1);
    }
    c.dose+=d;r.dose[i]=d;
  });
  r.lines.push(`<b>Radiation</b> inside 0.45 mSv × shield ${fmt(sm*100)}% · outside ≈0.7 mSv${S.speToday?` · SOLAR STORM +${S.speDose} mSv base`:''}`);
  // ---- crew effects
  let sciGain=0;
  const rover=S.modules.some(m=>m.type==='rover'&&active(m));
  const mf=S.morale<30?0.6:1;
  C.forEach(c=>{
    if(c.task==='hab')dm+=0.6;
    if(c.task==='rest'){dm+=3;dh+=c.role==='Medic'?6:2}
    if(c.task==='eva'){sciGain+=5*(c.role==='Geologist'?1.5:1)*(rover?1.4:1)*(S.storm>0?0.4:1)*mf;dm+=1}
    if(c.task==='berm')dm-=1;
    if(c.task==='farm')dm+=0.8;
  });
  if(S.morale<20)dh-=2;
  S.science+=sciGain;r.sci=sciGain;
  S.health=clamp(S.health+dh,0,100);S.morale=clamp(S.morale+dm,0,100);
  r.dh=dh;r.dm=dm;
  // ---- end of sol bookkeeping
  r.delta={o2:S.o2-before.o2,water:S.water-before.water,food:S.food-before.food,battery:S.battery-before.battery,health:S.health-before.health,morale:S.morale-before.morale,science:S.science-before.science};
  S.hist.push({sol:S.sol,o2:S.o2,water:S.water,food:S.food,battery:S.battery,batCap:S.batCap,health:S.health,morale:S.morale,science:S.science,dose:Math.max(...C.map(c=>c.dose))});
  if(S.o2<=0){S.o2=0;S.failed='oxygen'}
  else if(S.health<=0)S.failed='health';
  else{const over=C.find(c=>c.dose>=S.doseLimit);if(over)S.failed='radiation:'+over.name}
  S.last=r;
  if(S.storm>0){S.storm--;if(S.storm===0){r.notes.push('The dust storm has cleared. Sunlight is back.');if(S.shed&&S.shed.length){S.modules.forEach(m=>{if(S.shed.includes(m.id))m.on=true});S.shed=null;r.notes.push('Machines switched off for the storm are back on.')}}}
  if(S.drillSlow>0)S.drillSlow--;
  if(S.roverCool>0)S.roverCool--;
  S.dust=Math.max(0.35,S.dust-(S.storm>0?0.06:0.025));
  S.speToday=false;S.shelter=false;
  if(S.savedTasks){S.crew.forEach((c,i)=>c.task=S.savedTasks[i]);S.savedTasks=null;r.notes.push('The crew went back to their usual jobs.')}
  S.frost=S.winter?Math.min(1,S.frost+0.12):Math.max(0,(S.sol/S.N-0.45)*0.6);
  return r;
}

/* ---------------- Events (engineering decisions) ---------------- */
function mkEvent(key){
  const ghm=S.modules.find(m=>m.type==='greenhouse');
  const hasReactor=S.modules.some(m=>m.type==='reactor');
  switch(key){
  case 'spe':case 'spe2':return {key,kind:'bad',title:'Solar storm warning',
    text:`A flare just erupted on the Sun. A wave of fast protons will reach Mars within hours and hit the outpost during this sol. Anyone outside takes about ${S.speDose*2} mSv. Inside, the dose depends on your shielding (now ${Math.round(shieldMult()*100)}% gets through).${realSep()}`,
    fact:'Earth’s magnetic field and thick air shield us from most space radiation. Mars lost its global magnetic field long ago and its air is about 1% as thick as ours.',
    opts:[
      {l:'Everyone into the storm shelter',d:'Cancel all outdoor work. The crew sleeps in the shelter lined with water and food stores, which halves the dose inside.',tags:['+radiation safety','−science today','−berm progress'],
        go(){saveTasks();S.crew.forEach(c=>{if(TASKS[c.task].out)c.task='hab'});S.shelter=true;S.speToday=true},lesson:'You sheltered from a solar storm. Real Mars habitats plan a small, extra-shielded room for exactly this.'},
      ...(S.water>=400&&!S.waterWall?[{l:'Pump 400 L of water into the walls',d:'Water is great at stopping protons. Fill the water wall now and keep it as permanent shielding.',tags:['−400 L water','+35% shielding forever'],
        go(){S.water-=400;S.waterWall=true;saveTasks();S.crew.forEach(c=>{if(TASKS[c.task].out)c.task='hab'});S.speToday=true;world.syncShields()},lesson:'You turned drinking water into a radiation shield: one resource doing two jobs is a classic space-engineering trick.'}]:[]),
      {l:'Keep today’s plan',d:'Outdoor work goes ahead. Faster progress, much bigger doses.',tags:['+progress','−crew dose'],
        go(){S.speToday=true},lesson:'You kept working through a solar storm. Progress versus safety is a trade-off every mission faces.'},
    ]};
  case 'storm':{const d=4+Math.floor(Math.random()*3);return {key,kind:'bad',title:'Dust storm rolling in',
    text:`Orbiting satellites see a regional dust storm heading for the outpost. For about ${d} sols the dust will block roughly 75% of the sunlight. ${hasReactor?'Your reactor does not care about dust.':'Your solar arrays will barely work.'}`,
    fact:'In 2018 a planet-wide dust storm blocked so much sunlight that the solar-powered Opportunity rover lost power and never woke up again.',
    opts:[
      {l:'Shed load now',d:'Switch off the greenhouse, ice drill and oxygen makers until the sky clears. Keep heat and air running.',tags:['+power safety','−production'],
        go(){S.storm=d;S.shed=[];S.modules.forEach(m=>{if(['greenhouse','drill','moxie','electro'].includes(m.type)&&m.on){m.on=false;S.shed.push(m.id)}});world.syncModules()},lesson:'You shed load before a dust storm. Engineers decide in advance which systems get switched off first.'},
      {l:'Ride it out',d:'Keep everything on and trust the batteries. You can still switch things off later in Systems.',tags:['+production','−blackout risk'],
        go(){S.storm=d},lesson:'You kept everything running into a dust storm, betting on stored energy.'},
    ]};}
  case 'downlink':return {key,kind:'info',title:'Science data is ready to send',
    text:`Diego’s rock measurements are packed and ready. Earth is about ${pick([5,9,14,20])} light-minutes away today, so even a radio message takes a while.`,
    fact:'Most rover data reaches Earth through relay orbiters such as Mars Reconnaissance Orbiter, which can send far more data than a rover’s own antenna.',
    opts:[
      {l:'Send a small summary now',d:'Low-resolution results go straight to Earth. Scientists reply quickly with tips.',tags:['+5 science','+4 morale','−detail'],go(){S.science+=5;S.morale=Math.min(100,S.morale+4)},lesson:'You chose low latency: a quick, small answer.'},

/* ---- Manifest ---- */
function mStats(M=S.manifest){let mass=0,cost=0,pads=0;for(const k of ORDER){const n=M[k]||0;mass+=n*DEF[k].mass;cost+=n*DEF[k].cost;if(DEF[k].pad)pads+=n}return {mass,cost,pads}}
function preflight(){
  const M=S.manifest,n=k=>M[k]||0,N=S.N;
  const o2=10+60*n('o2tank'),water=40+800*n('watertank'),food=12+110*n('food');
  const o2p=2.4*n('moxie')+4.4*n('electro')+(n('greenhouse')?.8:0);
  const wp=45*n('drill')-5*n('electro')-12*n('greenhouse');
  const fp=n('greenhouse')?3:0;
  const load0=40+35*n('drill')+40*n('moxie')+30*n('electro')+50*n('greenhouse');
  const loadE=load0+48;
  const gen0=45*n('solar')+240*n('reactor'),genE=45*.55*.85*n('solar')+240*n('reactor');
  const cap=60+150*n('battery'),night=Math.max(0,load0/2-120*n('reactor'));
  const life=(stock,use,prod,grace=0)=>prod>=use?Infinity:(stock+prod*grace)/(use-prod);
  const o2L=life(o2-20,3.36,o2p*.85),wL=life(water,10,wp>0?wp*.85:wp),fL=fp?(food+Math.max(0,N-10)*fp)/4:food/4;
  const dose=N*.45*(n('poly')?.7:1)+2*S.speDose*(n('poly')?.7:1);
  const ck=(ok,warn)=>ok?'good':warn?'warn':'bad';
  const life2=v=>v===Infinity?'self-sufficient':`${Math.floor(v)} sols`;
  const out=[];
  out.push({s:ck(o2L>=N+3,o2L>=N*.9),t:`<b>Oxygen</b> lasts ≈${life2(o2L)} of ${N}, allowing for one leak and storm downtime.`+(o2L<N?' The crew cannot survive without air: add tanks or an oxygen maker.':'')});
  out.push({s:ck(wL>=N,wL>=N*.7),t:`<b>Water</b> lasts ${life2(wL)}.`+(n('electro')&&!n('drill')?' The water splitter drinks your water.':'')});
  out.push({s:ck(fL>=N,fL>=N*.75),t:`<b>Food</b> lasts about ${Math.floor(fL)} sols.`+(n('greenhouse')?' (Includes harvests once soil is washed and crops grow.)':'')});
  out.push({s:ck(gen0>=load0,gen0>=load0*.85),t:`<b>Power at landing:</b> ${fmt(gen0)} kWh made vs ${fmt(load0)} kWh needed per sol.`});
  out.push({s:ck(genE>=loadE,genE>=loadE*.75),t:`<b>Power by winter:</b> ≈${fmt(genE)} vs ≈${fmt(loadE)} kWh. Less sun, more heating.`+(genE<loadE?' You will need to switch machines off.':'')});
  out.push({s:ck(cap>=night||n('reactor'),cap>=night*.7),t:`<b>Night storage:</b> ${cap} kWh battery vs ≈${fmt(night)} kWh needed after sunset.`});
  out.push({s:ck(dose<S.doseLimit*.7,dose<S.doseLimit),t:`<b>Radiation</b> estimate ≈${fmt(dose)} mSv per person (limit ${S.doseLimit}), before any outdoor work. ${n('poly')?'':'Plan to build a regolith berm (8 crew-sols) or a water wall.'}`});
  out.push({s:n('rover')?'good':'warn',t:n('rover')?'<b>Science:</b> rover packed for expeditions.':'<b>Science:</b> no rover. Science on foot is slower.'});
  return out;
}

const ITEM_IMG={moxie:'PIA24203',greenhouse:'VEGGIE',drill:'PIA10906',poly:'PIA16938'};
const STARTER={solar:4,battery:2,drill:1,o2tank:2,food:2,spares:1,rover:1};

function launch(){
  const st=mStats();S.spent=st.cost;S.massUsed=st.mass;
  const M=S.manifest,n=k=>M[k]||0;
  S.o2=10+60*n('o2tank');S.water=40+800*n('watertank');S.food=12+110*n('food');S.spares=n('spares');S.poly=!!n('poly');
  S.pending=[];for(const k of ORDER)if(DEF[k].pad)for(let i=0;i<n(k);i++)S.pending.push(k);
  S.pending.sort((a,b)=>(b==='reactor')-(a==='reactor'));
  S.modules=[];S.phase='deploy';hide();
  world.landing();world.syncModules();world.setPlacing(S.pending[0]||null);
  $('#hud').hidden=false;UI.tab='build';mtab('rightp');
  log('Touchdown on Vastitas Borealis. Unloading cargo.');SFX.whoosh();
  ['iron','weights','weight'].forEach(b=>S.badges.includes(b)||S.badges.push(b));toast('<span class="lbl" style="color:var(--rust)">3 trade-offs discovered</span><br>Packing the rocket taught you the <b>iron triangle</b>, <b>weighted requirements</b> and <b>weight vs strength</b>.',5200);
  if(S.pending.length)toast('Tap a glowing landing pad to place each module. The reactor only fits on the outer ring.',5000);
  renderAll();
}
function autoPlace(){while(S.pending.length){const t=S.pending[0];const free=[...Array(12).keys()].filter(i=>!S.modules.some(m=>m.pad===i)&&(t!=='reactor'||i>=6));
  const pref=t==='reactor'?free:t==='solar'||t==='battery'?free.sort((a,b)=>a-b):free;if(!pref.length)break;UI.place(pref[0])}}
function beginMission(){
  S.phase='play';S.batCap=batCap();S.battery=S.batCap;world.setPlacing(null);UI.tab='crew';
  log(`Sol 1. A sol lasts 24 h 37 min. Assign each astronaut a task, then press End Sol.`);
  if(S.rank==='cadet')toast('Tip: a solar storm is likely in the first week or so. Two astronauts on <b>Build berm</b> for 4 sols makes a free radiation shield.',7000);
  renderAll();
}

/* ---- Sol loop ---- */
let busy=false;
function endSol(){
  if(busy||S.phase!=='play')return;busy=true;SFX.sol();
  if(S.crew.some(c=>TASKS[c.task].out))setTimeout(()=>award('safety'),3200);
  const solNow=S.sol;
  renderAll();
  world.runSol(()=>{
    const r=simulateSol();
    r.notes.forEach(n=>log(n));
    if(r.deficit>0&&!r.notes.some(n=>n.startsWith('Blackout')))log(`Power ran short by ${fmt(r.deficit)} kWh: machines slowed to ${fmt(r.f*100)}%.`);
    if(S.failed){busy=false;renderAll();debrief();return}
    const tip=TIPS[(solNow-1)%TIPS.length];
    S.sol++;
    if(S.sol>S.N){busy=false;S.ended=true;renderAll();debrief();return}
    const sumUp=`Sol ${solNow} done · O₂ ${sgn(r.delta.o2,1)} kg · water ${sgn(r.delta.water)} L · food ${sgn(r.delta.food,1)} · battery ${fmt(S.battery)}/${S.batCap} kWh${r.sci?` · science +${fmt(r.sci)}`:''}`;
    toast(sumUp,4200);
    const ev=chooseEvent();
    busy=false;renderAll();
    if(ev){S.lastEvent=S.sol;showEvent(ev)}else if(S.sol%3===0&&askQuiz()){}else if(tip&&Math.random()<.5)log(tip);
  });
}
function showEvent(ev){
  if(ev.pre)ev.pre();
  S.curEvent=ev;renderAll();
  if(ev.kind==='bad'){SFX.alarm();shake(ev.key&&ev.key.startsWith('spe')?'spe':'bad')}else SFX.good();
  SPEAK_TEXT=ev.title+'. '+ev.text+' Your options: '+ev.opts.map(o=>o.l+'. '+o.d).join(' Or: ');
  const im=EV_IMG[ev.key],tr=BADGES.find(b=>b[0]===EV_TRADE[ev.key]);
  show(`<div class="card narrow" role="dialog" aria-labelledby="evt">
    <div class="eyebrow" style="color:${ev.kind==='good'?'var(--good)':ev.kind==='bad'?'var(--bad)':'var(--sky)'}">Sol ${S.sol} · ${ev.kind==='good'?'Good news':ev.kind==='bad'?'Engineering decision':'Mission update'}</div>
    <div class="row" style="justify-content:space-between">${tr?`<span class="tradechip">Trade-off · ${tr[1]}</span>`:'<span></span>'}${canSpeak()?'<button class="sbtn" data-act="speak">Read aloud</button>':''}</div>
    <h2 id="evt" style="font-size:26px">${ev.title}</h2>
    <p>${ev.text}</p>
    <div class="opts">${ev.opts.map((o,i)=>`<button class="opt" data-act="evopt" data-arg="${i}" ${o.dis?'disabled':''} ${i===0?'data-focus':''}>
      <span class="l">${o.l}</span><span class="note" style="color:var(--fg)">${o.d}${o.dis?' <i>(no spare parts left)</i>':''}</span>
      <span class="tags">${o.tags.map(t=>`<span class="tag ${t[0]==='+'?'p':'m'}">${t}</span>`).join('')}</span></button>`).join('')}</div>
    <div class="didyou"><b>Real Mars:</b> ${ev.fact}</div>
    ${im?photo(im,'wide'):''}
  </div>`);
}
function chooseOpt(i){const ev=S.curEvent;if(!ev)return;const o=ev.opts[i];if(o.dis)return;o.go();
  if(o.lesson)S.choices.push({sol:S.sol,title:ev.title,pick:o.l,lesson:o.lesson});
  log(`${ev.title}: ${o.l}.`);S.curEvent=null;if(EV_TRADE[ev.key])award(EV_TRADE[ev.key]);hide();world.syncModules();renderAll()}

/* ---------------- Debrief ---------------- */
function debrief(){

  const ratio=(a,b)=>b>0?Math.min(1,a/b):0;
  const sc={
    safety:S.failed?Math.round(Math.min(40,S.health*.4)):Math.round(clamp(.6*S.health+40*(1-maxDose/S.doseLimit),0,100)),
    science:Math.round(clamp(S.science/S.sciGoal*100,0,100)),

  const wsum=Object.values(S.weights).reduce((a,b)=>a+b,0)||1;
  let total=Math.round(PRIOS.reduce((a,[k])=>a+sc[k]*S.weights[k],0)/wsum);
  if(S.failed)total=Math.min(total,35);
  const grade=S.failed?'F':total>=85?'S':total>=70?'A':total>=55?'B':total>=40?'C':'D';
  const reason=!S.failed?`All four crew made it through ${S.N} sols.`:
    S.failed==='oxygen'?`The oxygen ran out on sol ${S.sol}. Mission control ordered an emergency return.`:
    S.failed==='health'?`Crew health collapsed on sol ${S.sol}. The flight surgeon called off the mission.`:
    `${S.failed.split(':')[1]} passed the ${S.doseLimit} mSv radiation limit on sol ${S.sol}. The flight surgeon ordered everyone home.`;

  else if(nS)L.push(`<b>Power:</b> ${nS} solar arrays were light and cheap${S.stormSolarMin!=null?`, but during the dust storm they fell to ${S.stormSolarMin}% of full power`:''}. Weight versus reliability.`);

      <polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(255,125,69,.3)" stroke="#ff7d45" stroke-width="2"/>
      ${ax.map((a,i)=>{const [x,y]=P(a,1.18);return `<text x="${x}" y="${y+4}" fill="#f5e9df" font-size="12" text-anchor="middle" font-family="Chakra Petch,sans-serif">${lab[i]}</text>`}).join('')}

function answerQuiz(k){const q=QUIZ[S.curQuiz.i];const ok=+k===q[2];S.quiz.total++;

function cmeHistSvg(){const h=NASA.cmeHist,L=['<300','300–500','500–700','700–1000','1000–1500','1500+'],mx=Math.max(...h,1);
  return `<svg viewBox="0 0 600 120" width="100%" role="img" aria-label="Histogram of CME speeds">${h.map((v,i)=>{const bw=84,x=20+i*96,bh=v/mx*80;return `<rect x="${x}" y="${92-bh}" width="${bw}" height="${bh}" rx="2" fill="#e9b680"/><text x="${x+bw/2}" y="${86-bh}" fill="#f5e9df" font-size="12" text-anchor="middle" font-family="JetBrains Mono,monospace">${v}</text><text x="${x+bw/2}" y="110" fill="#bda594" font-size="11" text-anchor="middle" font-family="JetBrains Mono,monospace">${L[i]} km/s</text>`}).join('')}</svg>`}
function cmeDraw(prog,c){const cv=$('#cmecv');if(!cv)return;const x=cv.getContext('2d'),W=640,H=190;x.clearRect(0,0,W,H);
  for(let i=0;i<60;i++){x.fillStyle='rgba(255,255,255,'+(.15+((i*37)%10)/20)+')';x.fillRect((i*97)%W,(i*53)%H,1,1)}
  const sx=40,sc=(W-90)/1.52,ey=H/2;const sun=x.createRadialGradient(sx,ey,4,sx,ey,34);sun.addColorStop(0,'#fff6d8');sun.addColorStop(.5,'#ffb54a');sun.addColorStop(1,'rgba(255,120,40,0)');x.fillStyle=sun;x.beginPath();x.arc(sx,ey,34,0,7);x.fill();
  x.lineWidth=1;x.strokeStyle='rgba(189,165,148,.3)';x.setLineDash([3,4]);[1,1.52].forEach(r=>{x.beginPath();x.arc(sx,ey,r*sc,-.5,.5);x.stroke()});x.setLineDash([]);
  const ex=sx+sc,mx=sx+1.52*sc;x.fillStyle='#5aa9e6';x.beginPath();x.arc(ex,ey,7,0,7);x.fill();x.fillStyle='#d9643a';x.beginPath();x.arc(mx,ey,6,0,7);x.fill();
  x.font='12px Chakra Petch, sans-serif';x.fillStyle='#f5e9df';x.textAlign='center';x.fillText('Sun',sx,ey+50);x.fillText('Earth',ex,ey+26);x.fillText('Mars',mx,ey+26);
  if(prog>0){const r=prog*1.6*sc;const g=x.createRadialGradient(sx,ey,Math.max(1,r-26),sx,ey,r);g.addColorStop(0,'rgba(255,125,69,0)');g.addColorStop(.7,'rgba(255,125,69,.45)');g.addColorStop(1,'rgba(255,200,150,.9)');
    x.strokeStyle=g;x.lineWidth=24;x.beginPath();x.arc(sx,ey,Math.max(1,r-12),-.55,.55);x.stroke();
    if(c){const hrs=prog*1.6*149.6e6/c.speed/3600;x.fillStyle='#f5e9df';x.textAlign='left';x.font='600 14px JetBrains Mono, monospace';x.fillText(`T+${fmt(hrs)} h`,10,20);
      if(prog*1.6>=1)x.fillText('Earth hit',ex-30,ey-30);if(prog*1.6>=1.52){x.fillStyle='#ff7d45';x.fillText('Mars hit!',mx-36,ey-30)}}}}
function cmeLaunch(){const c=NASA.cmeFastest[DR.cme]||NASA.cmeFastest[0];cancelAnimationFrame(DR.raf);SFX.whoosh();const t0=performance.now();let hitE=false,hitM=false;
  (function f(now){const p=Math.min(1,(now-t0)/6000);cmeDraw(p,c);if(p*1.6>=1&&!hitE){hitE=true;SFX.click()}if(p*1.6>=1.52&&!hitM){hitM=true;SFX.alarm()}if(p<1&&$('#cmecv'))DR.raf=requestAnimationFrame(f)})(t0)}
function windTunnel(){const cv=$('#wtcv');if(!cv)return;const x=cv.getContext('2d'),W=640,H=200,FL=H-24;
  const TH={earth:{sand:6,walnut:4},mars:{sand:30,walnut:22}};
  const P=Array.from({length:220},()=>({x:Math.random()*W,y:FL-Math.random()*3,vx:0,vy:0,air:false}));let last=performance.now(),fan=0,stream=0;
  const upd=()=>{const th=TH[DR.wt.atm][DR.wt.grain],w=DR.wt.wind,on=w>=th;const st=$('#wtstate'),d=$('#wtd');if(!st)return;
    st.textContent=on?(w>=th*1.4?'Sandstorm!':'Grains hopping'):'Still';st.style.color=on?'var(--rust)':'var(--sky)';
    d.innerHTML=`${DR.wt.grain==='sand'?'Sand':'Walnut shell'} on ${DR.wt.atm==='mars'?'Mars':'Earth'} starts moving at about <b>${th} m/s</b>. You are blowing <b>${w} m/s</b>.`;
    if(on&&DR.wt.atm==='mars'&&DR.wt.grain==='sand'&&S&&S.phase==='play'&&!S.labDone){S.labDone=true;S.science+=12;SFX.good();toast('Lab result: sand moves on Mars at about 30 m/s, five times Earth’s 6 m/s. <b>+12 science</b>',5000)}};
  DR.wtUpd=upd;upd();
  (function f(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!$('#wtcv'))return;
    const th=TH[DR.wt.atm][DR.wt.grain],w=DR.wt.wind,ex=(w-th)/th,g=DR.wt.atm==='mars'?140:360,k=DR.wt.atm==='mars'?.9:3.5,light=DR.wt.grain==='walnut'?1.3:1;
    fan+=w*dt*.8;stream=(stream+w*dt*6)%40;
    x.fillStyle='#140d0b';x.fillRect(0,0,W,H);x.fillStyle='#2a1c17';x.fillRect(0,FL,W,H-FL);x.fillStyle='#3a2822';x.fillRect(0,0,W,8);x.fillRect(0,FL,W,3);
    x.strokeStyle='rgba(143,216,242,.18)';x.lineWidth=1;for(let yy=24;yy<FL-6;yy+=22){x.beginPath();for(let xx=-40+stream;xx<W;xx+=40){x.moveTo(xx,yy);x.lineTo(xx+Math.min(30,w*.8),yy)}x.stroke()}
    x.save();x.translate(46,H/2-10);x.rotate(fan);x.fillStyle='#bda594';for(let i=0;i<3;i++){x.rotate(Math.PI*2/3);x.fillRect(-3,0,6,34)}x.restore();
    for(const p of P){if(!p.air&&ex>0&&Math.random()<Math.min(.9,ex*1.6)*dt*3){p.air=true;p.vy=-(40+Math.random()*90)*Math.min(1.6,.5+ex)*light;p.vx=p.vx+w*.5}
      if(p.air){p.vx+=(w*6-p.vx)*k*.02*light;p.vy+=g*dt/light*1.2;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>=FL){p.y=FL-Math.random()*3;p.air=false;p.vx*=.3;p.vy=0}}
      else{p.vx*=.9;p.x+=p.vx*dt}
      if(p.x>W)p.x-=W;if(p.x<0)p.x+=W;
      x.fillStyle=DR.wt.grain==='walnut'?'#8a5a34':'#e0a46a';x.fillRect(p.x|0,p.y|0,3,3)}
    x.fillStyle='#bda594';x.font='12px JetBrains Mono, monospace';x.fillText(`${DR.wt.atm==='mars'?'MARS 6 mbar':'EARTH 1013 mbar'} · ${w} m/s`,W-200,22);
    DR.raf=requestAnimationFrame(f)})(last)}

  math(){S.math=!S.math;renderAll()},
  guide(){if(S&&S.phase!=='title')guide()},
  fulllog(){if(innerWidth>860)fullLog()},
  close(){cancelAnimationFrame(DR.raf);if(S&&S.phase==='title'){title();return}hide();renderAll()},
  dataroom(){dataRoom()},drtab(t){dataRoom(t)},about(){about()},
  sepdot(i){DR.sep=+i;SFX.click();dataRoom('storms')},
  cmepick(i){DR.cme=+i;dataRoom('cme')},cmego(){cmeLaunch()},
  wt(a){const [k,v]=a.split(':');DR.wt[k]=v;modal.querySelectorAll('[data-act=wt]').forEach(b=>{const [kk,vv]=b.dataset.arg.split(':');b.classList.toggle('primary',DR.wt[kk]===vv)});DR.wtUpd&&DR.wtUpd()},
  sound(){SFX.set(!SFX.on);const b=$('#soundbtn');b.textContent=SFX.on?'Sound on':'Sound off';b.setAttribute('aria-pressed',SFX.on)},
  speak(){speak(SPEAK_TEXT)},
  quiz(k){answerQuiz(k)},
  again(){const r=S.rank,w=S.weights,m=S.manifest;world.reset();S=newState(r);S.weights=w;S.manifest=m;$('#hud').hidden=true;manifest()},
};
document.addEventListener('click',e=>{SFX.wake();const b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(!['endsol','evopt','quiz','sepdot','cmego'].includes(b.dataset.act))SFX.click();const f=ACT[b.dataset.act];if(f)f(b.dataset.arg,b)});
document.addEventListener('input',e=>{const dr=e.target.dataset&&e.target.dataset.dr;
  if(dr==='sols'){DR.sols=+e.target.value;const st=sepStats(DR.sols);$('#solsv').textContent=DR.sols+' sols';$('#pv').textContent=Math.round(st.p*100)+'%';$('#pd').textContent=`chance of at least one storm (about ${fmt(st.exp,1)} expected), if storms come at last year’s rate.`}
  if(dr==='wind'){DR.wt.wind=+e.target.value;$('#windv').textContent=DR.wt.wind+' m/s';DR.wtUpd&&DR.wtUpd()}
  const p=e.target.dataset&&e.target.dataset.prio;if(p){S.weights[p]=+e.target.value;e.target.nextElementSibling.textContent=e.target.value}});
addEventListener('keydown',e=>{if(e.key==='Enter'&&S&&S.phase==='play'&&modal.hidden&&document.activeElement===document.body){endSol()}});

/* ---------------- Boot ---------------- */
function start(){
  modal.hidden=true;
  const ok=typeof THREE!=='undefined'&&world.init();
  if(!ok){document.body.insertAdjacentHTML('afterbegin','<p style="position:fixed;top:8px;left:16px;z-index:30;color:#f5c24f;font-size:12px">3D view unavailable on this device. The game still works.</p>')}
  title();
  refreshNasa();
}
start();
</script>
</body></html>
