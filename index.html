<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Red Frontier: a free Mars survival game for kids. Help Astro survive a crash on Mars by solving real Martian problems. NASA Space Apps 2026.">
<meta name="theme-color" content="#140D0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Frontier">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Red Frontier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:'Chakra Petch';font-weight:500;font-display:swap;src:url(fonts/chakra-petch-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Chakra Petch';font-weight:600;font-display:swap;src:url(fonts/chakra-petch-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Chakra Petch';font-weight:700;font-display:swap;src:url(fonts/chakra-petch-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Atkinson Hyperlegible';font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Atkinson Hyperlegible';font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2')}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: full-bleed 3D Mars world you walk through; HUD pinned to the four corners
   (level + tasks top-left, MAP top-right, D-pad bottom-left, action buttons bottom-right, tool belt bottom-centre).
   Puzzles open as 2D cards over the world. Single committed dark "mission control" look. */
:root{
  --ground:#140d0b;--panel:rgba(31,21,18,.90);--panel2:#2a1c17;--line:#4b342b;--fg:#f5e9df;--muted:#bda594;
  --rust:#ff7d45;--sky:#e9b680;--ice:#8fd8f2;--good:#80d897;--warn:#f5c24f;--bad:#ff6253;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* ---------- HUD corners ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto;position:absolute}
.pad-t{top:calc(12px + env(safe-area-inset-top,0px))}
.pad-b{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.pad-l{left:max(16px,env(safe-area-inset-left,0px))}
.pad-r{right:max(16px,env(safe-area-inset-right,0px))}
#tracker{max-width:min(320px,calc(100vw - 190px));padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#tracker .lv{display:flex;align-items:center;gap:8px}
#tracker .lvnum{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.12em;color:#1a0d07;background:var(--rust);border-radius:4px;padding:2px 7px}
#tracker .lvname{font-family:var(--f-display);font-weight:700;font-size:17px}
.tk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.tk .bx{flex:none;width:15px;height:15px;border-radius:3px;border:1.5px solid var(--muted);margin-top:2px;display:grid;place-items:center;font-size:10px}
.tk.done{color:var(--muted);text-decoration:line-through}
.tk.done .bx{background:var(--good);border-color:var(--good);color:#10240f}
.tk.lock{opacity:.55}
#tracker .collapse{display:none}
#corner{display:flex;gap:8px;align-items:flex-start;flex-direction:row-reverse}
#mapbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:8px 10px;border-radius:10px;border:2px solid var(--rust);background:var(--panel);font-family:var(--f-display);font-weight:700;letter-spacing:.08em}
#mapbtn svg{width:30px;height:30px}
#mapbtn .cnt{font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:0;background:var(--rust);color:#1a0d07;border-radius:999px;padding:0 7px}
.cbtn{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px}
.cbtn[aria-pressed="false"]{opacity:.7}
#cornerSmall{display:flex;flex-direction:column;gap:6px}
#timer{left:50%;transform:translateX(-50%);margin-top:62px;padding:8px 16px;text-align:center;border-color:var(--bad)}
#timer .t{font-family:var(--f-mono);font-size:26px;font-weight:600;color:var(--bad)}
#prompt{left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:var(--sky);color:#1a0d07;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);border:none}
#prompt kbd{font-family:var(--f-mono);background:#1a0d07;color:var(--sky);border-radius:4px;padding:1px 6px;margin-right:6px}
#tools{left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px}
.tool{width:52px;height:52px;border-radius:8px;border:1px solid var(--line);background:#1c1311;display:grid;place-items:center;position:relative}
.tool svg{width:32px;height:32px}
.tool.locked svg{opacity:.18}
.tool.active{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky)}
.tool.new{animation:pop 1.2s ease 2}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.25);box-shadow:0 0 20px var(--rust)}}
.tool .q{position:absolute;font-family:var(--f-display);color:var(--muted);font-size:16px}
#joy{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(233,182,128,.10),rgba(31,21,18,.82) 72%);border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#joy .ring{position:absolute;inset:16px;border-radius:50%;border:1px dashed rgba(233,182,128,.35);pointer-events:none}
#joy .knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb183,#ff7d45 60%,#c4552a);box-shadow:0 4px 14px rgba(0,0,0,.45);pointer-events:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:10px;letter-spacing:.08em;color:#1a0d07}
#joy.on{border-color:var(--sky);cursor:grabbing}
#joy .n{position:absolute;left:50%;top:3px;transform:translateX(-50%);font-family:var(--f-display);font-size:10px;color:var(--muted);pointer-events:none}
#compass{bottom:calc(172px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-left:55px}
#compass svg{width:30px;height:30px;transition:transform .1s linear}
#wx{left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:7px 12px;white-space:nowrap}
#wx .solno{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.1}
#wx .temp{font-family:var(--f-mono);font-size:19px;font-weight:600}
#wx .sub{font-size:11px;color:var(--muted);line-height:1.3}
#wx .sup{display:flex;flex-direction:column;gap:3px;min-width:100px}
.supbar{height:7px;border-radius:4px;background:#3a2822;overflow:hidden}.supbar i{display:block;height:100%;background:var(--good);transition:width .4s}
#manbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;padding:8px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em}
#manbtn svg{width:26px;height:26px}
#manbtn .cnt{font-family:var(--f-body);font-size:11px;letter-spacing:0;color:var(--muted)}
.craft{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.recipe{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.recipe.done{border-color:var(--good)}
.recipe svg{width:58px;height:58px}
.need2{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.res{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.res.ok{border-color:var(--good);color:var(--good)}.res.no{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.inv{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.inv span{padding:1px 8px;border-radius:999px;background:#3a2822}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.page{background:#efe4d0;color:#2a1a10;border-radius:4px;padding:12px;min-height:130px;font-size:13px;box-shadow:0 2px 0 #b9a888;position:relative;transform:rotate(var(--r,0deg))}
.page b{font-family:var(--f-display);font-size:14px;display:block;margin:0 40px 4px 0}
.page.miss{background:repeating-linear-gradient(45deg,#3a2822,#3a2822 8px,#33231e 8px,#33231e 16px);color:var(--muted);display:grid;place-items:center;text-align:center;box-shadow:none}
.page .no{position:absolute;top:8px;right:10px;font-family:var(--f-mono);font-size:11px;opacity:.65}
#story{width:100%;max-width:100%;aspect-ratio:16/9;border-radius:8px;border:1px solid var(--line);display:block;background:#05040a}
.caption{font-size:clamp(15px,2.2vw,19px);min-height:3.2em}
.hintbox{border:1px dashed #efe4d0;border-radius:6px;padding:8px 10px;font-size:13px;background:rgba(239,228,208,.08)}
.qblock{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
#dpad button,#acts button{border:1px solid var(--line);background:var(--panel);border-radius:12px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--f-display);font-weight:700}
#dpad button svg{width:26px;height:26px}
#dpad button.on,#acts button.on{background:var(--sky);color:#1a0d07}
#dpad .up{grid-column:2;grid-row:1}#dpad .left{grid-column:1;grid-row:2}#dpad .right{grid-column:3;grid-row:2}#dpad .down{grid-column:2;grid-row:3}
#dpad .mid{grid-column:2;grid-row:2;border:none;background:none;font-size:10px;color:var(--muted);letter-spacing:.1em}
#acts{display:flex;gap:10px;align-items:flex-end}
#usebtn{width:84px;height:84px;border-radius:50%!important;background:var(--rust)!important;color:#1a0d07;border:none!important;font-size:16px}
#usebtn:disabled{background:#5a4038!important;color:#bda594}
#jumpbtn{width:64px;height:64px;border-radius:50%!important;font-size:13px}
#acts small{display:block;font-family:var(--f-mono);font-size:10px;opacity:.75;font-weight:400}

/* ---------- Map ---------- */
#mapov{position:fixed;inset:0;z-index:15;background:rgba(12,7,6,.72);display:grid;place-items:center;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#mapcard{width:100%;max-width:1040px;max-height:100%;overflow:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
#mapcv{width:100%;aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);display:block;cursor:pointer}
.mrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13.5px}
.mrow.sel{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky)}
.mrow .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#1a0d07;background:var(--rust)}
.mrow.done .ic{background:var(--good)}
.mrow.done{color:var(--muted)}
.mrow.lock .ic{background:#5a4038;color:var(--fg)}
.mrow .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.prog{height:8px;background:#3a2822;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);transition:width .3s}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ---------- Modal + cards ---------- */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(12,7,6,.62);overflow:auto;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#modal.clear{background:linear-gradient(180deg,rgba(12,7,6,.1),rgba(12,7,6,.72))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:880px;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.narrow{max-width:580px}
.card p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--f-display);color:var(--rust);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:600}
.cta{border:none;border-radius:8px;background:var(--rust);color:#1a0d07;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;padding:12px 22px}
.cta:disabled{background:#5a4038;color:#bda594;cursor:not-allowed}
.ghost{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px 16px;font-family:var(--f-display);font-weight:600}
.sbtn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 10px;font-size:12.5px}
.sbtn.primary{background:var(--sky);border-color:var(--sky);color:#1a0d07;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sec{display:flex;flex-direction:column;gap:9px}
.fact{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:4px}
.fact .n{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--sky);line-height:1.1}
.fact .d{font-size:13px;color:var(--muted)}
.didyou{border-left:3px solid var(--ice);padding:6px 10px;font-size:13px;color:var(--fg)}
.didyou b{color:var(--ice)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12px;white-space:nowrap}
.chip.good{border-color:color-mix(in srgb,var(--good) 50%,transparent);color:var(--good)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.check{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.check .ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#160c08;margin-top:1px}
.ic.good{background:var(--good)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:11px 12px}
.opt:hover:not(:disabled){border-color:var(--rust)}
.opt.right{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.rtabs{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:6px;border:1px solid var(--line)}
.rtabs button{flex:1;border:none;background:none;padding:7px 4px;border-radius:4px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted)}
.rtabs button[aria-selected="true"]{background:var(--rust);color:#1a0d07}
.prio{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.prio input{width:100%;accent-color:var(--rust)}
.spark{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel2)}

/* title */
.hero{max-width:1000px;background:none;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;gap:18px}
.hero h1{font-size:clamp(44px,9vw,96px);line-height:.9;font-weight:700;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.hero h1 span{color:var(--rust)}
.hero .tag{font-size:clamp(15px,2.2vw,19px);max-width:54ch;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.lvlstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.lvlcard{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lvlcard .n{font-family:var(--f-mono);font-size:11px;color:var(--rust)}
.lvlcard b{font-family:var(--f-display);font-size:15px}
.lvlcard span{font-size:12px;color:var(--muted)}
.lvlcard.done{border-color:var(--good)}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.hero a.ghost,.cert~.row a.ghost,a.ghost{color:var(--fg)}
.keys kbd{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px}

/* mini-games */
.mgcv{width:100%;max-width:100%;display:block;border-radius:8px;border:1px solid var(--line);background:#120c0a;touch-action:none}
.mgbar{display:flex;align-items:center;gap:10px}
.mgbar .prog{flex:1;height:10px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{min-height:70px;border:2px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:12.5px}
.slot.full{border-style:solid;border-color:var(--ice);background:color-mix(in srgb,var(--ice) 12%,transparent)}
.slot .n{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.stepbtn{text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stepbtn b{font-family:var(--f-display);font-size:15px}
.stepbtn.shake{animation:shk .4s}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.budget{display:flex;gap:4px}
.cell{flex:1;height:16px;border-radius:3px;background:#3a2822}
.cell.on{background:var(--warn)}
.need{font-size:12.5px}
.need.ok{color:var(--good)}.need.no{color:var(--warn)}
.toolbig{display:flex;align-items:center;gap:16px;padding:14px;border:1px solid var(--rust);border-radius:10px;background:color-mix(in srgb,var(--rust) 10%,transparent)}
.toolbig svg{width:64px;height:64px;flex:none}
.cert{border:2px solid var(--sky);border-radius:12px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 50% 0%,rgba(233,182,128,.18),transparent 70%)}
.cert h2{font-size:clamp(26px,5vw,40px)}
.cert input{font:inherit;font-family:var(--f-display);font-size:22px;text-align:center;background:transparent;border:none;border-bottom:2px dashed var(--line);color:var(--fg);padding:4px;max-width:100%;width:340px;margin:0 auto}

/* NASA data room pieces (shared with the strategy mode) */

function about(){const st=sepStats(30);
  show(`<div class="card" style="max-width:980px">
  <div class="row" style="justify-content:space-between"><div><div class="eyebrow">NASA Space Apps 2026 · Build a Junior Astronaut Mission Trainer</div><h2 style="font-size:28px">About Red Frontier</h2></div><button class="ghost" data-act="close" data-focus>Close</button></div>
  <div class="grid2" style="align-items:start">
    <div class="sec"><span class="lbl">The problem</span><p>Space lessons for young learners usually either hide the engineering trade-offs or bury them in jargon. Students never <i>feel</i> why a mission succeeds or fails.</p>
      <span class="lbl">Our solution</span><p>A game where players run a Mars outpost and every choice costs something: mass, money, power, water, crew time or radiation dose. Decisions play out sol by sol in 3D, and the debrief explains what the player’s own choices did.</p></div>
    <div class="sec"><span class="lbl">How it fits the challenge</span>
      <div class="check"><span class="ic good">✓</span><span><b>Life support:</b> oxygen, water and food, shipped or made on Mars</span></div>
      <div class="check"><span class="ic good">✓</span><span><b>Radiation shielding:</b> berm, water wall, polyethylene; real solar storm data</span></div>
      <div class="check"><span class="ic good">✓</span><span><b>Power:</b> solar vs reactor, batteries, dust, storms, winter heating</span></div>
      <div class="check"><span class="ic good">✓</span><span><b>Food production:</b> greenhouse, perchlorate washing, grow lights</span></div>
      <div class="check"><span class="ic good">✓</span><span><b>Not too simple, not too complex:</b> Cadet hints, Commander math</span></div></div>
  </div>
  <div class="sec"><span class="lbl">Evidence: data, not guesses</span>
    <div class="grid3">
      <div class="fact"><span class="n">${NASA.sepEvents.length} storms</span><span class="d">solar particle storms from NASA DONKI, ${NASA.sepWindow[0]} to ${NASA.sepWindow[1]} (${NASA.sepReadings} readings). The rate sets the in-game storm risk (${Math.round(st.p*100)}% chance per 30 sols).</span></div>
      <div class="fact"><span class="n">${NASA.cmeCount} CMEs</span><span class="d">from NASA DONKI, ${NASA.cmeWindow[0]} to ${NASA.cmeWindow[1]}. Fastest ${NASA.cmeFastest[0].speed} km/s → ${fmt(227.9e6/NASA.cmeFastest[0].speed/3600)} h to Mars.</span></div>
      <div class="fact"><span class="n">${Object.keys(NIMG).length} NASA photos</span><span class="d">from images.nasa.gov, each tied to a game mechanic, with links to the official records.</span></div>
      <div class="fact"><span class="n">0.67 mSv/sol</span><span class="d">Curiosity RAD surface dose, used for outdoor work.</span></div>
      <div class="fact"><span class="n">0.84 kg O₂</span><span class="d">per astronaut per day; 4 crew use 3.36 kg every sol.</span></div>
      <div class="fact"><span class="n">10 kW</span><span class="d">fission power goal (NASA Kilopower) ≈ 240 kWh per sol.</span></div></div>
    <p class="note">Some numbers are scaled for play: panel output, crate mass and the mission dose budget (NASA’s real career limit is 600 mSv). Each one keeps the real ratio and is marked in the field guide.</p></div>
  <div class="grid2" style="align-items:start">
    <div class="sec"><span class="lbl">Testing and what we learned</span><p class="note" style="color:var(--fg)">Automated playthroughs of whole missions found real design bugs, and we fixed them: machines staying off after a dust storm (the crew ran out of air), a pre-flight check that was too optimistic, and shelter orders that never ended. Each game also counts quiz answers, so a playtest gives learning data.</p></div>
    <div class="sec"><span class="lbl">From the expert talk to the game</span><p class="note" style="color:var(--fg)">Sol length, ⅓ gravity, thin CO₂ air, seasons and CO₂ frost, the Phoenix and Curiosity missions, ice 10 m down, sulfates, volcanic regolith, perchlorate and iodine, magnetic field and cosmic rays, walnut-shell wind tunnels, the iron triangle, and five classic engineering trade-offs, all turned into mechanics, quiz questions and badges.</p></div></div>
  </div>`)}

const LEVELS=[
  {key:'power',name:'Power up',tool:'brush',reward:'drill',color:'#f5c24f',
   story:'Astro\u2019s rocket crash-landed right next to an empty NASA supply outpost. The crash blew red dust all over the outpost\u2019s solar panels, so its electronics and its food greenhouse have no power. Worse, Astro\u2019s emergency tools are made of wood and they will not last long on Mars.',
   goal:'Do both: brush the dust off the 3 solar panels, and collect Martian minerals to upgrade your wooden pickaxe, brush and shovel to stone at the workbench next to your rocket.',
   lesson:'Wooden tools were light enough to pack on the rocket, but weak. Stone tools made from Martian rock are stronger and cost no rocket fuel to bring. That is the trade-off of <b>weight vs strength</b>, and using what you find on Mars is called <b>living off the land</b>.',
   photo:'PIA12120'},
  {key:'water',name:'Find water',tool:'drill',reward:'oxy',color:'#8fd8f2',
   story:'Astro\u2019s water bottles will not last a month. Luckily there is ice buried under the crater to the north, like the ice NASA\u2019s Phoenix lander found on these same northern plains in 2008.',
   goal:'Drill down about 10 m at two icy spots in the crater, then clean the water at the water plant.',
   lesson:'Water is too heavy to bring from Earth in large amounts. Digging it up on Mars saves huge amounts of rocket fuel. NASA calls this <b>in-situ resource utilization</b>.',
   photo:'PIA10906'},
  {key:'air',name:'Make air',tool:'oxy',reward:'seeds',color:'#80d897',
   story:'Astro\u2019s spacesuit oxygen is running low. The air on Mars is 95% carbon dioxide, but a machine can split oxygen out of it, just like NASA\u2019s MOXIE experiment did on the Perseverance rover. And somewhere on the outpost, air is hissing out of a leak!',
   goal:'Run the oxygen maker, then follow the hissing sound around the habitat and patch the leak.',
   lesson:'Outside air pressure on Mars is less than 1% of Earth\u2019s, so the tiniest hole leaks air fast. Strong walls are heavy walls: <b>weight vs strength</b> again.',
   photo:'PIA24203'},
  {key:'food',name:'Grow food',tool:'seeds',reward:'radio',color:'#5fd06a',
   story:'Now that the greenhouse has power, Astro can grow fresh food. But Martian dirt contains perchlorate salts that are bad for people, and the greenhouse lights use lots of power.',
   goal:'Pick the toxic perchlorate crystals out of the soil, then share the power between light, heat and water to grow the plants.',
   lesson:'You only had 10 units of power for light, heat and water. You could not max out all three, so you shared it. That is a classic engineering trade-off: <b>a fixed budget</b>.',
   photo:'VEGGIE'},
  {key:'shield',name:'Solar storm!',tool:'shovel',reward:'beacon',color:'#ff6253',
   story:'Astro\u2019s radio picks up a warning: a big eruption on the Sun is sending a storm of fast particles to Mars. Mars has no magnetic field to protect you like Earth does. Astro and the 3 little sample robots from the rocket must get behind shielding before it arrives.',
   goal:'Carry 4 bags of regolith to build a shield wall, send the 3 sample robots inside, then get into the airlock yourself. Beat the timer!',
   lesson:'A wall of Martian dirt is free shielding, but it takes time and work to build. Shields brought from Earth are fast but heavy and expensive. That is <b>speed vs cost</b>.',
   photo:'PIA26302'},
  {key:'call',name:'Call Earth',tool:'radio',reward:'medal',color:'#8fd8f2',
   story:'The storm has passed. Now Astro can climb to the old satellite uplink on the ridge to the north-east and ask Earth for an immediate rescue, instead of waiting 5 more months. But its power cables are broken and the dish is pointing the wrong way.',
   goal:'Walk up to the satellite on the ridge, reconnect its power, aim the dish at Earth, then send the SOS.',
   lesson:'Radio signals travel at the speed of light, but Mars is so far away that a message takes between about 3 and 22 minutes to reach Earth. Engineers call waiting time <b>latency</b>: you cannot have a live chat with Mars.',
   photo:'PIA19400'},
];

  function mkPool(n,color,size){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3).fill(-999),3));
    const pts=new THREE.Points(g,new THREE.PointsMaterial({color,size,transparent:true,opacity:.85,depthWrite:false}));scene.add(pts);return {pts,items:Array.from({length:n},()=>({l:0,x:0,y:-999,z:0,vx:0,vy:0,vz:0})),i:0}}
  function emit(pool,x,y,z,vx,vy,vz,l=1){const it=pool.items[pool.i++%pool.items.length];Object.assign(it,{x,y,z,vx,vy,vz,l})}
  function stepPool(pool,dt,g=0){const a=pool.pts.geometry.attributes.position;pool.items.forEach((it,i)=>{if(it.l>0){it.l-=dt;it.vy-=g*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.z+=it.vz*dt;a.setXYZ(i,it.x,it.y,it.z)}else a.setXYZ(i,0,-999,0)});a.needsUpdate=true}

  function bindInput(){
    const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump'};
    addEventListener('keydown',e=>{if(!modal.hidden&&MG.key){if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();MG.key(e.code,true,e);return}
      if(!modal.hidden||G.phase!=='play'){if(e.code==='Escape'&&!$('#mapov').hidden)closeMap();return}
      if(e.code==='KeyM'){e.preventDefault();$('#mapov').hidden?openMap():closeMap();return}
      if(e.code==='Escape'&&!$('#mapov').hidden){closeMap();return}
      if(!$('#mapov').hidden)return;
      if(e.code==='KeyE'||e.code==='Enter'){e.preventDefault();doUse();return}
      const k=map[e.code];if(k){e.preventDefault();keys[k]=true}});
    addEventListener('keyup',e=>{if(!modal.hidden&&MG.key){MG.key(e.code,false,e);return}const k=map[e.code];if(k)keys[k]=false});
    addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
    document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on');SFX.wake()};const off=()=>{keys[k]=false;b.classList.remove('on')};
      b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);b.addEventListener('contextmenu',e=>e.preventDefault())});
    {const el=$('#joy'),knob=el.querySelector('.knob');
      const set=e=>{const r=el.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const max=r.width/2-20,m=Math.hypot(dx,dy);if(m>max){dx*=max/m;dy*=max/m}JOY.x=dx/max;JOY.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`};
      el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(err){}JOY.on=true;JOY.id=e.pointerId;el.classList.add('on');set(e);SFX.wake()});
      el.addEventListener('pointermove',e=>{if(JOY.on&&e.pointerId===JOY.id)set(e)});
      const end=e=>{if(e.pointerId!==JOY.id)return;JOY.on=false;JOY.x=JOY.y=0;knob.style.transform='';el.classList.remove('on')};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
    {const ptrs=new Map();let pinch=0;
      cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(err){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}});
      cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
        if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)camZ=clamp(camZ*pinch/d,.6,1.6);pinch=d;return}
        camYaw-=dx*.008;camPitch=clamp(camPitch+dy*.004,-.5,.6)});
      const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}
    addEventListener('keydown',e=>{if(G&&G.phase==='play'&&modal.hidden&&$('#mapov').hidden){if(e.code==='KeyQ')camYaw+=.25;if(e.code==='KeyR')camYaw-=.25}});

function interactables(){

    out.push({at:t.at,label:t.id==='inside'?'Enter the airlock':`Start: ${t.name}`,act:()=>t.id==='inside'?finishStorm():openGame(t)})}

    out.push({at:nd.at,label:`Mine basalt with the ${toolName('pickaxe').toLowerCase()}`,act:()=>mine(nd)})}}

    if(G.carrying&&G.bags<4){const s=SLOTS[G.bags];out.push({at:s,label:'Drop the bag on the wall',act:()=>{G.carrying=false;G.bags++;SFX.good();world.sparkle(s[0],s[1],18);if(G.bags>=4)completeTask('bags');else toast(`Shield wall: ${G.bags} of 4 bags.`,2000)}})}

  return out}

  shell(t,'Found it! Air is hissing out through tiny holes in the habitat wall. When a hole starts puffing, tap it fast to stick a patch on. Patch all 6. Keyboard: number keys 1–6.',
    `<canvas id="mg" class="mgcv"></canvas><p class="note" id="mgv">Patched 0 of 6 · misses 0 of 3</p>`);
  const [cv,x]=cvs(480,300);const holes=[...Array(6)].map((_,i)=>({x:100+(i%3)*140,y:100+Math.floor(i/3)*110,p:false}));let act=-1,win=0,patched=0,miss=0,done=false;const puffs=[];
  const next=()=>{const open=holes.map((h,i)=>i).filter(i=>!holes[i].p);if(!open.length)return;act=pick(open);win=1.8-patched*.12;SFX.hiss(.8)};
  const tap=i=>{if(done||i<0)return;if(i===act){holes[i].p=true;patched++;act=-1;SFX.right();setTimeout(next,450);if(patched===6){done=true;setTimeout(()=>{completeTask(t.id);won(t,'Leak patched!','The habitat is holding its air again. Outside, Mars’ air pressure is less than 1% of Earth’s, so even a pinhole leaks fast. That is why habitat walls must be strong, which also makes them heavy.',null)},500)}}else{SFX.wrong()}
    $('#mgv').textContent=`Patched ${patched} of 6 · misses ${miss} of 3`};
  cv.onpointerdown=e=>{const [px,py]=ptr(cv,e);holes.forEach((h,i)=>{if(Math.hypot(h.x-px,h.y-py)<38)tap(i)})};
  MG.key=(k,dn)=>{if(dn&&/^Digit[1-6]$/.test(k))tap(+k.slice(5)-1)};
  setTimeout(next,700);let lt=performance.now();
  (function f(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;
    if(act>=0&&!done){win-=dt;if(Math.random()<.7)puffs.push({x:holes[act].x,y:holes[act].y,vx:(Math.random()-.5)*60,vy:-40-Math.random()*60,l:1});
      if(win<=0){miss++;act=-1;SFX.bad();$('#mgv').textContent=`Patched ${patched} of 6 · misses ${miss} of 3`;if(miss>=3){done=true;failed(t,'Too much air escaped','The holes puffed for too long. Try again and tap each hole as soon as it starts hissing.');return}setTimeout(next,500)}}
    const g=x.createLinearGradient(0,0,0,300);g.addColorStop(0,'#e9e3dc');g.addColorStop(1,'#bfb8b0');x.fillStyle=g;x.fillRect(0,0,480,300);
    x.strokeStyle='#a39c94';x.lineWidth=2;for(let i=1;i<4;i++){x.beginPath();x.moveTo(i*120,0);x.lineTo(i*120,300);x.stroke()}x.fillStyle='#8e877f';for(let i=0;i<4;i++)for(let j=0;j<6;j++){x.beginPath();x.arc(i*120+10,j*50+20,3,0,7);x.fill()}
    holes.forEach((h,i)=>{if(h.p){x.fillStyle='#ff7d45';x.fillRect(h.x-22,h.y-22,44,44);x.strokeStyle='#1a0d07';x.lineWidth=2;x.beginPath();x.moveTo(h.x-14,h.y);x.lineTo(h.x-4,h.y+10);x.lineTo(h.x+14,h.y-10);x.stroke()}
      else{x.fillStyle=i===act?'#1a0d07':'#5a524b';x.beginPath();x.arc(h.x,h.y,i===act?10:5,0,7);x.fill();if(i===act){x.strokeStyle=`rgba(255,98,83,${.5+.5*Math.sin(now/80)})`;x.lineWidth=3;x.beginPath();x.arc(h.x,h.y,26,0,7);x.stroke()}
        x.fillStyle='#8e877f';x.font='11px JetBrains Mono, monospace';x.fillText(i+1,h.x-3,h.y+42)}});
    for(const p of puffs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.5;if(p.l>0){x.fillStyle=`rgba(255,255,255,${p.l*.8})`;x.beginPath();x.arc(p.x,p.y,6+(1-p.l)*10,0,7);x.fill()}}while(puffs.length&&puffs[0].l<=0)puffs.shift();
    MG.raf=requestAnimationFrame(f)})(lt)},

wash(t){
  shell(t,'Martian soil has yellow perchlorate crystals mixed in. They are bad for people. Tap all 10 yellow crystals to pick them out before time runs out. Leave the good red soil alone!',
    `<canvas id="mg" class="mgcv"></canvas><div class="mgbar"><span class="lbl">Crystals left</span><span class="mono" id="mgv">10</span><span class="lbl" style="margin-left:auto">Time</span><span class="mono" id="mgt2">40 s</span></div>`);
  const [cv,x]=cvs(480,300);const grains=[...Array(170)].map(()=>({x:40+Math.random()*400,y:40+Math.random()*220,r:5+Math.random()*6,c:pick(['#9a5634','#7c3d22','#b8683a','#a5582f']),j:Math.random()*6}));
  let cr=[...Array(10)].map(()=>({x:50+Math.random()*380,y:50+Math.random()*200,j:Math.random()*6})),time=40,done=false;const sp=[];
  const tap=(px,py)=>{if(done)return;const c=cr.find(c=>Math.hypot(c.x-px,c.y-py)<16);if(c){cr=cr.filter(q=>q!==c);SFX.right();for(let i=0;i<12;i++)sp.push({x:c.x,y:c.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,l:.7});$('#mgv').textContent=cr.length;
      if(!cr.length){done=true;setTimeout(()=>{completeTask(t.id);won(t,'Soil is clean!','NASA’s Phoenix lander discovered perchlorate in Martian soil in 2008. Astronauts would wash it out of the soil before growing food, and take iodine to protect their thyroid gland.','PIA10959')},500)}}
    else if(grains.some(g=>Math.hypot(g.x-px,g.y-py)<g.r+2)){time-=2;SFX.wrong();sp.push({x:px,y:py,t:'-2 s',l:1})}};
  cv.onpointerdown=e=>tap(...ptr(cv,e));
  MG.key=(k,dn)=>{if(dn&&k==='Space'&&cr.length)tap(cr[0].x,cr[0].y)};
  let lt=performance.now();
  (function f(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;if(!done)time-=dt;
    x.fillStyle='#3a2822';x.fillRect(0,0,480,300);x.fillStyle='#5a3a2c';x.fillRect(24,24,432,252);
    for(const g of grains){g.j+=dt*3;x.fillStyle=g.c;x.beginPath();x.arc(g.x+Math.sin(g.j)*.8,g.y,g.r,0,7);x.fill()}
    for(const c of cr){c.j+=dt*4;const s=8+Math.sin(c.j)*1.2;x.fillStyle='#f5d34f';x.beginPath();x.moveTo(c.x,c.y-s);x.lineTo(c.x+s*.7,c.y);x.lineTo(c.x,c.y+s);x.lineTo(c.x-s*.7,c.y);x.closePath();x.fill();x.fillStyle='#fff8c8';x.fillRect(c.x-1,c.y-4,2,3)}
    for(const p of sp){p.l-=dt;if(p.t){x.fillStyle=`rgba(255,98,83,${Math.max(0,p.l)})`;x.font='700 16px Chakra Petch, sans-serif';x.fillText(p.t,p.x,p.y-(1-p.l)*30)}else{p.x+=p.vx*dt;p.y+=p.vy*dt;x.fillStyle=`rgba(255,240,160,${Math.max(0,p.l)})`;x.fillRect(p.x,p.y,3,3)}}
    while(sp.length&&sp[0].l<=0)sp.shift();
    $('#mgt2').textContent=Math.max(0,Math.ceil(time))+' s';
    if(time<=0&&!done){done=true;failed(t,'Time ran out',`${cr.length} toxic crystal${cr.length>1?'s are':' is'} still in the soil. Look for the yellow diamond shapes: they sparkle a little.`);return}
    MG.raf=requestAnimationFrame(f)})(lt)},

grow(t){
  const need={light:4,heat:3,water:2},BUD=10;const v={light:2,heat:2,water:2};
  shell(t,'Plants need <b>light</b>, <b>heat</b> and <b>water</b>. But the greenhouse only gets <b>10 power units</b>. Share the power so every need is met, then press Grow.',
    `<div class="grid2" style="align-items:center"><canvas id="mg" class="mgcv"></canvas>
      <div class="sec"><div class="row" style="justify-content:space-between"><span class="lbl">Power used</span><span class="mono" id="budv"></span></div><div class="budget" id="bud"></div>
      ${['light','heat','water'].map(k=>`<label class="prio" for="g-${k}"><span>${k==='light'?'Grow lights':k==='heat'?'Heaters':'Water pump'}</span><input type="range" id="g-${k}" min="0" max="7" step="1" value="${v[k]}" data-grow="${k}"><span class="mono" id="gv-${k}">${v[k]}</span></label><div class="need" id="gn-${k}"></div>`).join('')}
      <button class="cta" data-act="growgo">Grow for 10 sols</button></div></div><p class="note" id="mgv"></p>`);
  const [cv,x]=cvs(300,260);let grow=0,anim=0;
  const upd=()=>{const used=v.light+v.heat+v.water;$('#budv').textContent=`${used} / ${BUD}`;$('#bud').innerHTML=[...Array(BUD)].map((_,i)=>`<span class="cell ${i<used?'on':''}"></span>`).join('');
    const msg={light:['Plants need at least 4 to make food from light.','Bright enough!'],heat:['Below 3 the leaves freeze. Mars nights reach −80 °C.','Warm enough!'],water:['Below 2 the plants dry out and wilt.','Watered!']};
    for(const k in v){const ok=v[k]>=need[k];const el=$('#gn-'+k);el.className='need '+(ok?'ok':'no');el.textContent=(ok?'✓ ':'! ')+msg[k][ok?1:0];$('#gv-'+k).textContent=v[k]}};
  MG.grow=(k,val)=>{const others=Object.keys(v).filter(q=>q!==k).reduce((a,q)=>a+v[q],0);v[k]=Math.min(val,BUD-others);$('#g-'+k).value=v[k];upd()};
  MG.growGo=()=>{if(anim)return;anim=1;const ok=v.light>=need.light&&v.heat>=need.heat&&v.water>=need.water;SFX.whoosh();
    setTimeout(()=>{if(ok){completeTask(t.id);won(t,'Your plants are growing!','You could not give everything the maximum. You shared 10 power units so that light, heat and water were all just enough. That is how engineers solve a fixed budget. NASA tests the same kind of LED plant growth for space.','VEGGIE')}
      else{anim=0;grow=0;SFX.wrong();G.mistakes++;const miss=Object.keys(need).filter(k=>v[k]<need[k]);$('#mgv').innerHTML=`<b style="color:var(--warn)">The plants struggled:</b> not enough ${miss.join(' and ')}. Move some power from another slider.`}},1800)};
  upd();let lt=performance.now();
  (function f(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;if(anim)grow=Math.min(1,grow+dt*.6);
    const okL=v.light>=4,okH=v.heat>=3,okW=v.water>=2;const sky=x.createLinearGradient(0,0,0,260);sky.addColorStop(0,`rgba(255,79,216,${.1+v.light*.06})`);sky.addColorStop(1,'#1a1012');x.fillStyle=sky;x.fillRect(0,0,300,260);
    x.fillStyle='#4a2c1e';x.fillRect(0,215,300,45);
    for(let p=0;p<3;p++){const cx=60+p*90,h=30+grow*(okL&&okH&&okW?110:40)+Math.min(v.light,4)*4;const droop=okW?0:18;
      x.strokeStyle='#3fae4c';x.lineWidth=5;x.beginPath();x.moveTo(cx,215);x.quadraticCurveTo(cx+droop,215-h*.6,cx+droop*1.5,215-h);x.stroke();
      const leaf=okH?(okL?'#5fd06a':'#c9d36a'):'#9fd8e8';x.fillStyle=leaf;for(let l=0;l<4;l++){const ly=215-h*(.3+l*.18),s=l%2?1:-1;x.beginPath();x.ellipse(cx+droop*(l/4)+s*14,ly+(okW?0:8),14,6,s*.5+(okW?0:s*.6),0,7);x.fill()}
      if(okL&&okH&&okW&&grow>.7){x.fillStyle='#ff5a40';x.beginPath();x.arc(cx+droop*1.5+8,215-h+12,7,0,7);x.fill()}}
    if(!okH){x.fillStyle='rgba(200,240,255,.7)';for(let i=0;i<20;i++)x.fillRect((i*53+now/20)%300,(i*31)%200,2,2)}
    MG.raf=requestAnimationFrame(f)})(lt)},
};

const POIS=[['Habitat',0,0,'#f2ede6',5],['Solar panels',27,-14,'#4b77b8',0],['Battery',16.5,-6.5,'#40ff9a',0],['Ice crater',0,-46,'#e8f2f6',14],['Water plant',-18.5,-12,'#4aa3d6',0],['Oxygen maker',20.5,14,'#d4a640',0],['Greenhouse',0,25,'#5fd06a',0],['Regolith pile',-29,27,'#a86a44',0],['Rover',-23,8,'#eeeae4',0],['Radio tower',-13,-24,'#ff3020',0],['Rocket wreck',36,4,'#e9e3dc',0],['Workbench',30.5,10.5,'#b9824a',0],['Satellite',54,-51,'#8fd8f2',0]];
function openMap(){if(!G||G.phase!=='play')return;G.paused=true;for(const k in world.keys)world.keys[k]=false;$('#mapov').hidden=false;renderMapList();cancelAnimationFrame(MAP.raf);drawMapLoop();SFX.click()}
function closeMap(){$('#mapov').hidden=true;cancelAnimationFrame(MAP.raf);if(modal.hidden)G.paused=false}
function m2s(x,z,S){return [(x-MAP.cx)/MAP.ext*S/2+S/2,(z-MAP.cz)/MAP.ext*S/2+S/2]}
function renderMapList(){const L=LEVELS[G.level],ts=levelTasks(G.level),done=ts.filter(t=>G.done[t.id]).length,P=world.player();
  const dirTo=(p)=>{if(!p)return '';const dx=p[0]-P.x,dz=p[1]-P.z,d=Math.hypot(dx,dz);const a=(Math.atan2(dx,-dz)*180/Math.PI+360)%360;const n=['N','NE','E','SE','S','SW','W','NW'][Math.round(a/45)%8];return `${Math.round(d)} m ${n}`};
  $('#mapcard').innerHTML=`<div class="sec" style="min-width:0"><div class="row" style="justify-content:space-between"><span class="lbl">Outpost map · north is up</span><span class="note">Tap a task to set your guide arrow</span></div><canvas id="mapcv" width="720" height="720" aria-label="Map of the Mars base with task locations"></canvas>
    <div class="legend"><span><span class="sw" style="background:#ff7d45"></span>Task to do</span><span><span class="sw" style="background:#80d897"></span>Done</span><span><span class="sw" style="background:#7a6a62"></span>Locked for now</span><span><span class="sw" style="background:#8fd8f2"></span>You</span>${G.level===4?'<span><span class="sw" style="background:#f0a94a"></span>Sample robot</span>':''}${G.level===0?'<span><span class="sw" style="background:#4a4246;border-radius:0"></span>Minerals to collect</span>':''}</div></div>
   <div class="sec" style="min-width:0"><div class="row" style="justify-content:space-between"><h2 style="font-size:22px">Level ${G.level+1}: ${L.name}</h2><button class="ghost" data-act="closemap" aria-label="Close map">Close <span class="mono" style="font-size:11px">M</span></button></div>
    <div class="row" style="justify-content:space-between"><span class="note">${done} of ${ts.length} tasks done</span><span class="note">${ts.length-done} remaining</span></div><div class="prog"><i style="width:${done/ts.length*100}%"></i></div>
    ${G.storm!=null?`<div class="didyou" style="border-color:var(--bad)"><b style="color:var(--bad)">Storm in ${Math.floor(G.storm/60)}:${String(Math.floor(G.storm%60)).padStart(2,'0')}</b> (the timer is paused while the map is open)</div>`:''}

      <span>${d?'<span class="note">Done</span>':lk?'':`<span class="d">${dirTo(p)}</span><br><button class="sbtn ${G.waypoint===t.id?'primary':''}" data-act="waypoint" data-arg="${t.id}">Guide me</button>`}</span></div>`}).join('')}
    <label class="row note"><input type="checkbox" id="guidechk" ${G.guide?'checked':''} data-act="guide"> Show the guide arrow at my feet</label>
    <span class="lbl">Coming up</span><div class="note">${LEVELS.slice(G.level+1).map((l,i)=>`Level ${G.level+i+2}: ${l.name} (needs the ${TOOLS[l.tool].toLowerCase()})`).join('<br>')||'This is the final level!'}</div>

function drawMapLoop(){const cv=$('#mapcv');if(!cv||$('#mapov').hidden)return;const x=cv.getContext('2d'),S=720,now=performance.now(),P=world.player();
  x.fillStyle='#2a1610';x.fillRect(0,0,S,S);const g=x.createRadialGradient(S/2,S/2,40,S/2,S/2,S*.62);g.addColorStop(0,'#9a5634');g.addColorStop(1,'#5a2c1a');x.fillStyle=g;x.beginPath();x.arc(...m2s(0,0,S),78/MAP.ext*S/2,0,7);x.fill();

  const [px,py]=m2s(P.x,P.z,S);x.save();x.translate(px,py);x.rotate(-P.face+Math.PI);x.fillStyle='#8fd8f2';x.strokeStyle='#0d2a36';x.lineWidth=3;x.beginPath();x.moveTo(0,-16);x.lineTo(11,12);x.lineTo(0,6);x.lineTo(-11,12);x.closePath();x.fill();x.stroke();x.restore();
  x.fillStyle='#8fd8f2';x.font='700 14px Chakra Petch, sans-serif';x.fillText('YOU',px,py+30);x.textAlign='left';
  MAP.raf=requestAnimationFrame(drawMapLoop)}

   <svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Phoenix daily air pressure by sol">

  if(d.dr==='sols'){DR.sols=+e.target.value;const st=sepStats(DR.sols);$('#solsv').textContent=DR.sols+' sols';$('#pv').textContent=Math.round(st.p*100)+'%';$('#pd').textContent=`chance of at least one storm (about ${fmt(st.exp,1)} expected), if storms come at last year’s rate.`}
  if(d.dr==='wxsol'){DR.wxi=+e.target.value;const w=PHX.days[DR.wxi];$('#wxsolv').innerHTML=wxReport(w)}
  if(d.dr==='wind'){DR.wt.wind=+e.target.value;$('#windv').textContent=DR.wt.wind+' m/s';DR.wtUpd&&DR.wtUpd()}
  if(e.target.id==='certname'){try{localStorage.setItem('rf-name',e.target.value)}catch(err){}}});
// extra sounds for the adventure
SFX.hop=()=>{};SFX.brush=()=>{};SFX.drill=()=>{};SFX.pop=()=>{};SFX.hiss=()=>{};
(()=>{let ac=null;const ctx=()=>{if(!SFX.on)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}return ac};
  const noise=(d,v,f,type='bandpass')=>{const a=ctx();if(!a)return;const b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=a.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start()};
  const tone=(f,d,v,type='sine',slide=0)=>{const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)};
  SFX.hop=()=>tone(300,.35,.04,'sine',300);SFX.brush=()=>noise(.15,.05,2500);SFX.drill=()=>tone(90,.25,.03,'sawtooth',30);SFX.pop=()=>tone(520,.1,.05,'triangle',300);SFX.hiss=v=>noise(.5,.05*v,6000,'highpass')})();

const STANDALONE=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
const INSTALL={prompt:null};
const ONPAGES=/\.github\.io$/.test(location.hostname)||location.hostname==='localhost';
addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL.prompt=e});
if('serviceWorker' in navigator&&location.protocol==='https:'&&/\.github\.io$/.test(location.hostname)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
function start(){
  modal.hidden=true;
  const ok=typeof THREE!=='undefined'&&world.init();

  title();refreshNasa();renderGfx();
}
start();
